server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    location /auth/ {
        proxy_pass http://identity:8090;
    }

    location /oauth2/ {
        proxy_pass http://identity:8090;
    }

    location /board/ {
        proxy_pass http://board:8091;
    }
}
