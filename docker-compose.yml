services:
  mysql:
    image: mysql:8.0
    container_name: idsvc-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root # PoC only — no secrets here
    ports:
      - "3307:3306" # host 3307 — 3306 is taken by another project's MySQL
    volumes:
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: idsvc-redis
    ports:
      - "6380:6379" # host 6380 — 6379 is taken by the go-msa project's Redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  identity:
    build:
      context: .
      dockerfile: services/identity/Dockerfile
    container_name: idsvc-identity
    environment:
      MYSQL_DSN: root:root@tcp(mysql:3306)/identity?parseTime=true
      REDIS_ADDR: redis:6379
      ISSUER: http://localhost:8090 # logical iss identifier; must match the boards' TOKEN_ISSUER
      SIGNING_KEY_PATH: /app/data/keys/identity-signing.pem
      DEV_MODE: "true"
    ports:
      - "8090:8090" # HTTP: gateway + OIDC endpoints
      - "9090:9090" # gRPC
    volumes:
      - identity-keys:/app/data/keys # key survives container recreation
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/.well-known/openid-configuration"]
      interval: 5s
      timeout: 3s
      retries: 12

  board:
    build:
      context: .
      dockerfile: services/board/Dockerfile
    container_name: idsvc-board
    environment:
      MYSQL_DSN: root:root@tcp(mysql:3306)/board?parseTime=true
      REDIS_ADDR: redis:6379 # event stream consumer
      # Fetch URL uses the compose-internal hostname; iss stays the logical id.
      JWKS_URL: http://identity:8090/oauth2/v1/jwks
      TOKEN_ISSUER: http://localhost:8090
      TOKEN_AUDIENCE: board
    ports:
      - "8091:8091" # HTTP: gateway
      - "9092:9091" # gRPC — host 9092, 9091 is taken on this host
    depends_on:
      mysql:
        condition: service_healthy
      identity:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8091/board/v1/posts"]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    build: ./web
    container_name: idsvc-web
    depends_on:
      identity:
        condition: service_healthy
      board:
        condition: service_healthy
    ports:
      - "5174:80" # demo frontend; 5173 stays free for the Vite dev server

volumes:
  mysql-data:
  identity-keys:
